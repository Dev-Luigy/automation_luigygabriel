name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Test, lint, and build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --frozen --group dev

      - name: Run tests
        run: uv run --frozen pytest -W error

      - name: Run Ruff
        run: uv run --frozen ruff check src tests

      - name: Validate browser JavaScript
        run: find src/expense_agent/presentation/static -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Reject whitespace errors
        run: git diff --check

      - name: Build distributions
        run: uv build
