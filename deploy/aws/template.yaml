AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >-
  Expense Agent assessment sandbox. This stack is not the accepted production
  architecture and must not process real financial or receipt data.

Parameters:
  BuildId:
    Type: String
    MinLength: 1
    MaxLength: 192
    AllowedPattern: "^[A-Za-z0-9][A-Za-z0-9._:@+-]{0,191}$"
    Description: Immutable source and dependency-lock identity supplied by deploy.sh.
  EnvironmentName:
    Type: String
    Default: expense-agent-sandbox
    AllowedPattern: "^[a-z][a-z0-9-]{2,31}$"
    Description: Lowercase name used to identify the sandbox resources.
  ReviewerUsername:
    Type: String
    Default: reviewer
    MinLength: 1
    MaxLength: 128
    AllowedPattern: "^[A-Za-z0-9._@+-]+$"
  ReviewerId:
    Type: String
    Default: assessment-reviewer
    MinLength: 1
    MaxLength: 128
    AllowedPattern: "^[A-Za-z0-9._:@+-]+$"
  ReviewerEmail:
    Type: String
    Default: reviewer@example.com
    MinLength: 3
    MaxLength: 254
    AllowedPattern: "^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+[.][A-Za-z]{2,}$"
  ReviewerDisplayName:
    Type: String
    Default: Assessment Reviewer
    MinLength: 1
    MaxLength: 128
    AllowedPattern: "^[A-Za-z0-9 ._@+-]+$"
  ReviewerPasswordHash:
    Type: String
    NoEcho: true
    MinLength: 64
    MaxLength: 512
    AllowedPattern: '^pbkdf2_sha256[$][0-9]{6,7}[$][A-Za-z0-9_-]+[$][A-Za-z0-9_-]+$'
    Description: PBKDF2 hash generated by the repository helper; never plaintext.
  SeedPasswordHash:
    Type: String
    NoEcho: true
    MinLength: 64
    MaxLength: 512
    AllowedPattern: '^pbkdf2_sha256[$][0-9]{6,7}[$][A-Za-z0-9_-]+[$][A-Za-z0-9_-]+$'
    Description: Random one-run credential for the separate synthetic seed actor.
  CsrfSecret:
    Type: String
    NoEcho: true
    MinLength: 32
    MaxLength: 256
    AllowedPattern: "^[A-Za-z0-9._~+-]{32,256}$"
    Description: Random sandbox-only HMAC secret generated by deploy.sh.

Resources:
  SandboxVpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.42.0.0/20
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags:
        - Key: Name
          Value: !Sub "${EnvironmentName}-vpc"
        - Key: expense-agent:scope
          Value: assessment-sandbox

  PrivateSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      AvailabilityZone: !Select [0, !GetAZs ""]
      CidrBlock: 10.42.0.0/24
      MapPublicIpOnLaunch: false
      VpcId: !Ref SandboxVpc
      Tags:
        - Key: Name
          Value: !Sub "${EnvironmentName}-private-a"

  PrivateSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      AvailabilityZone: !Select [1, !GetAZs ""]
      CidrBlock: 10.42.1.0/24
      MapPublicIpOnLaunch: false
      VpcId: !Ref SandboxVpc
      Tags:
        - Key: Name
          Value: !Sub "${EnvironmentName}-private-b"

  LambdaSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Expense Agent sandbox Lambda clients
      VpcId: !Ref SandboxVpc
      Tags:
        - Key: Name
          Value: !Sub "${EnvironmentName}-lambda"

  EfsSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Expense Agent sandbox EFS mount targets
      SecurityGroupIngress:
        - Description: NFS from the sandbox Lambda only
          FromPort: 2049
          IpProtocol: tcp
          SourceSecurityGroupId: !Ref LambdaSecurityGroup
          ToPort: 2049
      VpcId: !Ref SandboxVpc
      Tags:
        - Key: Name
          Value: !Sub "${EnvironmentName}-efs"

  ReviewFileSystem:
    Type: AWS::EFS::FileSystem
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BackupPolicy:
        Status: ENABLED
      Encrypted: true
      PerformanceMode: generalPurpose
      ThroughputMode: bursting
      FileSystemTags:
        - Key: Name
          Value: !Sub "${EnvironmentName}-sqlite"
        - Key: expense-agent:scope
          Value: assessment-sandbox

  ReviewAccessPoint:
    Type: AWS::EFS::AccessPoint
    Properties:
      FileSystemId: !Ref ReviewFileSystem
      PosixUser:
        Gid: "1000"
        Uid: "1000"
      RootDirectory:
        CreationInfo:
          OwnerGid: "1000"
          OwnerUid: "1000"
          Permissions: "0750"
        Path: /expense-agent

  MountTargetA:
    Type: AWS::EFS::MountTarget
    Properties:
      FileSystemId: !Ref ReviewFileSystem
      SecurityGroups:
        - !Ref EfsSecurityGroup
      SubnetId: !Ref PrivateSubnetA

  MountTargetB:
    Type: AWS::EFS::MountTarget
    Properties:
      FileSystemId: !Ref ReviewFileSystem
      SecurityGroups:
        - !Ref EfsSecurityGroup
      SubnetId: !Ref PrivateSubnetB

  ApiAccessLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub "/aws/http-api/${EnvironmentName}"
      RetentionInDays: 14

  ReviewFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub "/aws/lambda/${EnvironmentName}-web"
      RetentionInDays: 14

  ReviewHttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      AccessLogSettings:
        DestinationArn: !GetAtt ApiAccessLogGroup.Arn
        Format: >-
          {"requestId":"$context.requestId","requestTime":"$context.requestTime",
          "httpMethod":"$context.httpMethod","routeKey":"$context.routeKey",
          "status":"$context.status","responseLength":"$context.responseLength",
          "integrationError":"$context.integrationErrorMessage"}
      Description: Direct HTTPS edge for the assessment sandbox only
      FailOnWarnings: true
      StageName: $default
      Tags:
        expense-agent:scope: assessment-sandbox

  ReviewFunction:
    Type: AWS::Serverless::Function
    DependsOn:
      - MountTargetA
      - MountTargetB
      - ReviewFunctionLogGroup
    Properties:
      Architectures:
        - x86_64
      CodeUri: .build/lambda
      Description: Expense Agent executable assessment; never production financial traffic
      Environment:
        Variables:
          EXPENSE_AGENT_ALLOWED_HOSTS: !Sub "*.execute-api.${AWS::Region}.${AWS::URLSuffix}"
          EXPENSE_AGENT_ATTACHMENT_MAX_BYTES: "4194304"
          EXPENSE_AGENT_ATTACHMENT_ROOT: /mnt/expense-agent/attachments
          EXPENSE_AGENT_BUILD_ID: !Ref BuildId
          EXPENSE_AGENT_CSRF_SECRET: !Ref CsrfSecret
          EXPENSE_AGENT_DATABASE_PATH: /mnt/expense-agent/expense-agent.sqlite3
          EXPENSE_AGENT_REQUIRE_HTTPS: "true"
          EXPENSE_AGENT_REVIEWERS_JSON: !Sub >-
            [{"username":"${ReviewerUsername}","reviewer_id":"${ReviewerId}",
            "email":"${ReviewerEmail}","display_name":"${ReviewerDisplayName}",
            "password_hash":"${ReviewerPasswordHash}","roles":["admin"]},
            {"username":"sandbox-seed","reviewer_id":"assessment:seed-submitter",
            "email":"sandbox-seed@example.com","display_name":"Synthetic Seed Actor",
            "password_hash":"${SeedPasswordHash}","roles":["admin"]}]
          EXPENSE_AGENT_SQLITE_JOURNAL_MODE: DELETE
      Events:
        DefaultRoute:
          Type: HttpApi
          Properties:
            ApiId: !Ref ReviewHttpApi
      FileSystemConfigs:
        - Arn: !GetAtt ReviewAccessPoint.Arn
          LocalMountPath: /mnt/expense-agent
      FunctionName: !Sub "${EnvironmentName}-web"
      Handler: expense_agent.presentation.lambda_handler.handler
      MemorySize: 512
      Policies:
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole"
        - Statement:
            - Action:
                - elasticfilesystem:ClientMount
                - elasticfilesystem:ClientWrite
              Condition:
                StringEquals:
                  elasticfilesystem:AccessPointArn: !GetAtt ReviewAccessPoint.Arn
              Effect: Allow
              Resource: !GetAtt ReviewFileSystem.Arn
      ReservedConcurrentExecutions: 4
      Runtime: python3.12
      Timeout: 28
      Tracing: Active
      VpcConfig:
        SecurityGroupIds:
          - !Ref LambdaSecurityGroup
        SubnetIds:
          - !Ref PrivateSubnetA
          - !Ref PrivateSubnetB

  ReviewFunctionErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Expense Agent sandbox Lambda returned at least one error in five minutes
      ComparisonOperator: GreaterThanThreshold
      Dimensions:
        - Name: FunctionName
          Value: !Ref ReviewFunction
      EvaluationPeriods: 1
      MetricName: Errors
      Namespace: AWS/Lambda
      Period: 300
      Statistic: Sum
      Threshold: 0
      TreatMissingData: notBreaching

  ReviewFunctionThrottleAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Expense Agent sandbox exceeded its bounded Lambda concurrency
      ComparisonOperator: GreaterThanThreshold
      Dimensions:
        - Name: FunctionName
          Value: !Ref ReviewFunction
      EvaluationPeriods: 1
      MetricName: Throttles
      Namespace: AWS/Lambda
      Period: 300
      Statistic: Sum
      Threshold: 0
      TreatMissingData: notBreaching

Outputs:
  ApiUrl:
    Description: Base HTTPS URL for API calls and the assessment UI.
    Value: !Sub "https://${ReviewHttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}"
  ReviewUrl:
    Description: Open this URL after deployment and sign in with the configured reviewer.
    Value: !Sub "https://${ReviewHttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/reviews"
  SubmitUrl:
    Description: Open this URL to upload and track a synthetic reimbursement.
    Value: !Sub "https://${ReviewHttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/submit"
  FileSystemId:
    Description: Retained EFS filesystem containing the sandbox SQLite file.
    Value: !Ref ReviewFileSystem
  SafetyBoundary:
    Description: Non-production warning carried with the deployed stack.
    Value: ASSESSMENT SANDBOX ONLY - DO NOT USE REAL FINANCIAL OR RECEIPT DATA
