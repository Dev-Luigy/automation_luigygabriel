[build-system]
requires = ["hatchling==1.31.0", "editables==0.3"]
build-backend = "hatchling.build"

[project]
name = "expense-agent"
version = "0.1.0"
description = "Auditable reimbursement decision service"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn>=0.30,<1.0",
]

[dependency-groups]
dev = [
  "httpx2>=2.7,<3.0",
  "pytest>=8.0,<9.0",
  "ruff>=0.16.2,<1.0",
]

[project.scripts]
expense-agent-review = "expense_agent.presentation.main:run"
expense-agent-hash-password = "expense_agent.presentation.credentials:run"
expense-agent-seed-demo = "expense_agent.presentation.demo_seed:run"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.hatch.build]
exclude = ["/tmp"]

[tool.hatch.build.targets.wheel]
packages = ["src/expense_agent"]
